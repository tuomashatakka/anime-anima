<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anime-anima — VRM viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header id="toolbar">
        <span class="brand">anime&middot;anima</span>
        <div class="toolbar-group">
          <button id="btn-models" class="toolbar-button" aria-haspopup="true" aria-expanded="false">
            <span class="icon">&#128100;</span>
            <span class="label">Model</span>
            <span id="current-model" class="current">&hellip;</span>
          </button>
          <button id="btn-animations" class="toolbar-button" aria-haspopup="true" aria-expanded="false">
            <span class="icon">&#127916;</span>
            <span class="label">Animation</span>
            <span id="current-animation" class="current">&hellip;</span>
          </button>
        </div>
      </header>

      <!-- popovers are injected by ui.ts -->
      <div id="loading" class="loading">Loading&hellip;</div>
      <div class="hint">Drag to orbit &middot; tap the ground to move (tap again to speed up)</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anime-anima — VRM viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header id="toolbar">
        <span class="brand">anime&middot;anima</span>
        <div class="toolbar-group">
          <button id="btn-models" class="toolbar-button" aria-haspopup="true" aria-expanded="false">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
            <span class="label">Model</span>
            <span id="current-model" class="current">&hellip;</span>
          </button>
          <button id="btn-animations" class="toolbar-button" aria-haspopup="true" aria-expanded="false">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M16 4v16"/></svg></span>
            <span class="label">Animation</span>
            <span id="current-animation" class="current">&hellip;</span>
          </button>
          <button id="btn-lighting" class="toolbar-button" aria-haspopup="true" aria-expanded="false">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.8 10.6c.8.7 1.3 1.5 1.3 2.4h5c0-.9.5-1.7 1.3-2.4A6 6 0 0 0 12 3z"/></svg></span>
            <span class="label">Lighting</span>
            <span id="current-lighting" class="current">&hellip;</span>
          </button>
          <button id="btn-furniture" class="toolbar-button" aria-haspopup="true" aria-expanded="false">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M4 9a2 2 0 0 0-2 2v4h20v-4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v1H6v-1a2 2 0 0 0-2-2z"/><path d="M5 15v3M19 15v3"/></svg></span>
            <span class="label">Furniture</span>
            <span class="current">Drag in</span>
          </button>
          <button id="btn-walls" class="toolbar-button" aria-pressed="false">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18M3 16h18"/><path d="M7 4v4M14 4v4M10 8v8M17 8v8M4 16v4M14 16v4"/></svg></span>
            <span class="label">Walls</span>
            <span id="current-walls" class="current">Off</span>
          </button>
          <button id="btn-lights" class="toolbar-button" aria-pressed="false">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M4 6l2 2M20 6l-2 2M3 14h3M18 14h3"/><path d="M12 7a5 5 0 0 0-3 9h6a5 5 0 0 0-3-9z"/><path d="M9 20h6"/></svg></span>
            <span class="label">Lights</span>
            <span id="current-lights" class="current">Off</span>
          </button>
          <button id="btn-settings" class="toolbar-button icon-only" title="Settings">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span>
          </button>
        </div>
      </header>

      <!-- popovers + settings dialog + light panel are injected by ui.ts -->
      <button id="furniture-remove" class="furniture-remove" title="Remove selected furniture (Del)">&#10005; Remove</button>
      <div id="fps" class="fps">– fps</div>
      <div id="loading" class="loading">Loading&hellip;</div>
      <div class="hint">Drag to orbit &middot; tap the ground to move &middot; drag furniture in, then grab the handles to move &amp; rotate</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
